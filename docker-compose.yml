# Estima3D in containers: nginx serves the web app on localhost and proxies
# /api to the backend, which stays on the Compose network. Build with
# scripts/docker-build.ps1 (or .sh) so both images carry the same revision.
# Runbook: docs/DOCKER.md. Configuration: .env (copy .env.example).
name: estima3d

x-build-args: &build-args
  SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
  BUILD_ID: ${BUILD_ID:-unknown}

services:
  backend:
    build:
      context: ./backend
      target: production
      args: *build-args
      tags: ["estima3d-api:${BUILD_ID:-unknown}"]
    image: estima3d-api:${IMAGE_TAG:-current}
    restart: unless-stopped
    environment:
      APP_ENV: production
      HOST: 0.0.0.0
      PORT: 8000
      # One worker: review/learning state and caches are file-backed and
      # process-local (docs/DOCKER.md, "Single instance").
      WEB_CONCURRENCY: 1
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # uploads/ and training/ live on the data volume (docker-entrypoint.sh).
      DATA_DIR: /data
      # Required: every /api route needs `Authorization: Bearer <token>`.
      API_ACCESS_TOKEN: ${API_ACCESS_TOKEN:?Set API_ACCESS_TOKEN in .env (see .env.example)}
      # Same-origin through nginx: no cross-origin callers by default.
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-209715200}
      UPLOAD_ANALYSIS_TIMEOUT_SECONDS: ${UPLOAD_ANALYSIS_TIMEOUT_SECONDS:-1800}
      ARTIFACT_RETENTION_DOCUMENTS: ${ARTIFACT_RETENTION_DOCUMENTS:-3}
      ARTIFACT_MIN_FREE_BYTES: ${ARTIFACT_MIN_FREE_BYTES:-419430400}
      # Optional LLM polish; the deterministic summary always runs without it.
      DRAWING_SUMMARY_LLM_ENABLED: ${DRAWING_SUMMARY_LLM_ENABLED:-false}
      LEGEND_PROFILE_LLM_ENABLED: ${LEGEND_PROFILE_LLM_ENABLED:-false}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      LEGEND_LLM_MODEL: ${LEGEND_LLM_MODEL:-llama3.1:8b}
    volumes:
      - data:/data
    mem_limit: ${BACKEND_MEMORY_LIMIT:-3g}
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      # The first start copies the image's training/ seed onto an empty volume.
      start_period: 180s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args: *build-args
      tags: ["estima3d-web:${BUILD_ID:-unknown}"]
    image: estima3d-web:${IMAGE_TAG:-current}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    mem_limit: 256m
    depends_on:
      backend:
        condition: service_healthy

  # Optional local LLM (docker compose --profile ollama up -d). Models are
  # pulled explicitly (docs/DOCKER.md) into their own volume; CPU only.
  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:0.34.3
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    mem_limit: ${OLLAMA_MEMORY_LIMIT:-8g}

  # Backend test suite in the image's own environment (never deployed):
  # docker compose --profile test run --rm backend-tests
  backend-tests:
    profiles: ["test"]
    build:
      context: ./backend
      target: test
      args: *build-args
    image: estima3d-api-tests:${BUILD_ID:-unknown}
    environment:
      APP_ENV: development
      ESTIMA3D_TESTING_PROJECTS: /testing-projects
    volumes:
      # Optional real drawings for the reference tests; skipped when absent.
      - ${TESTING_PROJECTS_DIR:-./backend/tests/fixtures}:/testing-projects:ro
      # Test inputs kept out of every image: repo docs/validation (tests read
      # <repo>/docs, which resolves to /docs here) and the evaluation snapshots.
      - ./docs:/docs:ro
      - ./backend/training/eval_cache_backups:/app/training/eval_cache_backups:ro
      # A few tests address files as <repo>/backend/... (fixtures, config.py).
      - ./backend:/backend:ro
    mem_limit: ${BACKEND_MEMORY_LIMIT:-3g}

volumes:
  # All uploaded drawings and their extractions. Restoring a backup into another
  # volume and pointing ESTIMA3D_DATA_VOLUME at it leaves this one untouched.
  data:
    name: ${ESTIMA3D_DATA_VOLUME:-estima3d_data}
  ollama_models:
    name: estima3d_ollama_models
