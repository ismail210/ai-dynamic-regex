server {
    listen 80;
    server_name _;
    # Same ceiling as the backend's MAX_UPLOAD_BYTES (200 MB).
    client_max_body_size 200m;

    # nginx's stock map lacks .mjs; pdf.js loads its worker as a module script,
    # which browsers refuse as application/octet-stream (blank PDF viewer).
    include /etc/nginx/mime.types;
    types {
        application/javascript mjs;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Docker's DNS, resolved per request: a recreated backend container gets a
    # new address, and nginx must not keep proxying to the old one.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Build identity of this image (the API reports its own at /api/version).
    location = /version.json {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store" always;
    }

    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Match long extract/analyze budgets (backend default 30 min).
        proxy_read_timeout 2100s;
        proxy_send_timeout 2100s;
    }

    # `/upload` is also a client route (it redirects to /upload-extract): a page
    # load gets the app, an API call (POST) the backend. Without this, nginx
    # would 301 `/upload` to the `/upload/` proxy and the page would never load.
    location = /upload {
        if ($request_method != GET) {
            proxy_pass $backend;
        }
        root /usr/share/nginx/html;
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
    }

    location /upload/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 2100s;
        proxy_send_timeout 2100s;
    }

    # Hashed build assets never change under the same name.
    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Client routes (/drawing-summary, /drawing-summary/report, ...) load the
    # app; index.html is revalidated so a new image is picked up on reload.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
    }
}
